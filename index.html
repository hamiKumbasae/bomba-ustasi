<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a16">
<title>Bomba Ustası</title>
<style>
  :root { --gece: #0c0a16; --metin: #e8e0cc; --soluk: #9a92ac; --kenar: #3c3468; --sari: #f2c230; --kirmizi: #c4302a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--gece); color: var(--metin); font-family: monospace; min-height: 100dvh;
    display: grid; place-items: start center; }
  main { width: min(100vw, 860px); padding: 12px 16px 24px; }
  canvas { display: block; width: 100%; aspect-ratio: 256 / 240; background: #100e1c; image-rendering: pixelated;
    touch-action: none; border: 3px solid; border-color: #2a2444 #4a4078 #4a4078 #2a2444; }
  .dugmeler { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  button { font: inherit; color: var(--metin); background: #1c1834; border: 2px solid; border-color: #4a4078 #141024 #141024 #4a4078;
    padding: 10px 14px; cursor: pointer; touch-action: manipulation; }
  button:active { border-color: #141024 #4a4078 #4a4078 #141024; }
  button:focus-visible { outline: 2px solid var(--sari); outline-offset: 2px; }
  p { color: var(--soluk); text-align: center; line-height: 1.7; margin: 14px 0 0; }

  /* Dokunmatik kumanda: yalnız dokunmatik ekranlarda. */
  .dokun { display: none; margin-top: 14px; grid-template-columns: 1fr auto; align-items: center; gap: 16px; }
  @media (pointer: coarse) { .dokun { display: grid; } }
  #yonhaci { position: relative; width: min(46vw, 190px); aspect-ratio: 1; touch-action: none; }
  #yonhaci::before, #yonhaci::after { content: ''; position: absolute; background: #2a2648;
    border: 3px solid; border-color: #5a5090 #141024 #141024 #5a5090; }
  #yonhaci::before { left: 33%; right: 33%; top: 0; bottom: 0; }
  #yonhaci::after { top: 33%; bottom: 33%; left: 0; right: 0; }
  #yonhaci span { position: absolute; z-index: 1; color: #c8c0e0; font-size: 18px; pointer-events: none; transform: translate(-50%, -50%); }
  #yonhaci[data-yon="up"] span.u, #yonhaci[data-yon="down"] span.d, #yonhaci[data-yon="left"] span.l, #yonhaci[data-yon="right"] span.r { color: var(--sari); }
  #bomba { width: min(34vw, 130px); aspect-ratio: 1; border-radius: 50%; font-size: 15px; color: #fff;
    background: radial-gradient(circle at 35% 30%, #ec6450, var(--kirmizi) 55%, #7a1a14); border: 3px solid #4a0e0a; }
  #bomba:active { filter: brightness(0.85); transform: translateY(2px); }

  body.tv { overflow: hidden; }
  body.tv main { width: 100vw; height: 100vh; padding: 0; display: grid; place-items: center; }
  body.tv canvas { width: auto; height: 100vh; max-width: 100vw; border: 0; }
  body.tv .dugmeler, body.tv p, body.tv .dokun { display: none; }
</style>
</head>
<body>
<main>
  <canvas aria-label="Bomba Ustası oyun alanı"></canvas>
  <div class="dokun" aria-label="Dokunmatik kumanda">
    <div id="yonhaci" role="group" aria-label="Yön">
      <span class="u" style="left:50%;top:16%">▲</span><span class="d" style="left:50%;top:84%">▼</span>
      <span class="l" style="left:16%;top:50%">◀</span><span class="r" style="left:84%;top:50%">▶</span>
    </div>
    <button id="bomba" type="button">DİNAMİT</button>
  </div>
  <div class="dugmeler">
    <button id="duraklat" type="button">Duraklat</button>
    <button id="ekran" type="button">Ekran</button>
    <button id="ses" type="button">Ses</button>
  </div>
  <p>Oklar: yürü · Boşluk: dinamit · P: duraklat · Esc: menü · C: ekran (temiz / tüplü TV / VCD) · M: ses<br>
  Kapışmada 2. oyuncu WASD + F. Telefonları kumanda yapmak için <b>Telefonla oyna</b> (K).</p>
</main>
<script src="src/levels.js"></script>
<script src="src/core.js"></script>
<script src="src/sprites.js"></script>
<script src="src/main.js"></script>
<script src="src/remote.js"></script>
</body>
</html>
